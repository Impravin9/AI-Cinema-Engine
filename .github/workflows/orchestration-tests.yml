name: Python orchestration tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python entry points and adapters
        run: python -m compileall -q cinema.py lego_cinema_fixes.py realistic_director.py lego_modern.py lego_boost.py core tests
      - name: Run orchestration, LEGO and realistic director tests
        run: python -m unittest discover -s tests -v
